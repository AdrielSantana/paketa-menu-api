name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: format, lint, typecheck e testes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend-desafio
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: backend-desafio/.nvmrc
          cache: npm
          cache-dependency-path: backend-desafio/package-lock.json

      # Binário do mongod usado pelo mongodb-memory-server (~80 MB).
      - uses: actions/cache@v6
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('backend-desafio/test/setup/mongo-server.ts') }}

      - run: npm ci

      # O mesmo comando que roda localmente e no hook do agente.
      - run: npm run check
